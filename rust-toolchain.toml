# 검증 툴체인 핀 — 로컬과 CI가 **같은 컴파일러**를 쓰게 한다.
#
# ## 왜 핀하는가
# rustfmt는 버전마다 출력이 조금씩 달라진다. 이 브랜치는 1.93.0으로 포맷해 커밋했는데,
# 로컬 stable이 1.96으로 올라간 뒤 `cargo fmt --all -- --check`가 **손대지도 않은 파일
# 156개**를 실패로 잡았다. 그 상태에서는 fmt 검사가 신호를 잃는다 — 진짜 포맷 누락과
# 툴체인 차이를 구분할 수 없고, 통과시키려면 릴리스 직전에 전 파일을 다시 포맷하는
# 거대한 무관 diff를 만들어야 한다.
#
# clippy도 같다. 린트 적용 범위가 버전마다 달라, 1.88에서는 1.93에 없는 방식으로 플래그가
# 뜬다(`.github/workflows/ci.yml` 상단 주석). "어느 컴파일러에서 green인가"가 정해져 있지
# 않으면 `-D warnings`는 버전 운에 좌우된다.
#
# ## MSRV와 다른 것이다
# `Cargo.toml`의 `rust-version = "1.88"`은 **사용자가 이 크레이트를 빌드할 수 있는 최소
# 버전**이고(mongodb v3.7 요구), 이 파일은 **우리가 검증에 쓰는 버전**이다. 둘은 서로를
# 대체하지 않는다: MSRV 주장은 CI의 `msrv` 잡이 1.88로 `cargo check`를 돌려 지킨다.
#
# 그 잡은 이 파일을 **명시적으로 우회해야 한다.** `rust-toolchain.toml`은 rustup 기본값을
# 이기므로, 맨 `cargo check`를 쓰면 1.88이 아니라 1.93이 돌고 MSRV 검사가 조용히 무력화된다
# (통과는 계속 하므로 아무도 모른다). 우회 방법은 `cargo +1.88.0 …` 또는
# `RUSTUP_TOOLCHAIN=1.88.0` 환경변수다 — 둘 다 이 파일보다 우선한다(실측 확인).
#
# ## 버전을 올릴 때
# 이 값을 바꾸면 `cargo fmt --all`을 함께 돌려 **포맷 변경만 담은 커밋 하나**로 분리하라.
# 기능 변경과 섞이면 그 diff는 리뷰가 불가능해진다.
#
# `targets`는 두지 않는다. 릴리스 빌드(`scripts/release.sh`)가 필요한 트리플을 그때
# `rustup target add`로 붙이고, CI(Linux)에서 darwin 타깃을 미리 내려받는 것은 낭비다.
[toolchain]
channel = "1.93.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
