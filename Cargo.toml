[package]
name = "x-backup"
version = "0.1.0"
edition = "2021"
# rust-version: mongodb v3.7 요구사항(1.88+)을 고려해 MSRV를 1.88로 고정한다.
rust-version = "1.88"
description = "MongoDB 백업·복구 CLI — 풀/증분(oplog), 로컬/원격(S3 호환), 암호화 중심"
license = "MIT"

[features]
# 통합 테스트 격리(환경에 mongodump/mongorestore + replica set 필요).
# 기본 빌드/CI 단위 테스트에는 포함하지 않는다 — `--features integration-tests`로만 활성화.
integration-tests = []

[[bin]]
name = "x-backup"
path = "src/main.rs"

[lib]
name = "x_backup"
path = "src/lib.rs"

# 의존성은 리서치 stack 최종 표 기준의 "골격" 범위만 선언한다.
# 무거운 도메인 의존성(mongodb, object_store, age, async-compression 등)은
# 각 기능 태스크가 필요 시 추가한다 — 스캐폴드 단계에서는 의도적으로 제외.
[dependencies]
# 비동기 런타임 (PRD §7 async 파이프라인 토대)
tokio = { version = "1.47", features = ["full"] }
# CLI 파서 — derive + env(시크릿 env 참조/오버라이드 보조)
clap = { version = "4", features = ["derive", "env"] }
# 직렬화/역직렬화 + config.toml 파싱 + JSON 출력(--json)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 에러 모델 (PRD §9 exit code 매핑의 토대)
thiserror = "2"
anyhow = "1"
# 구조화 로그 (PRD §11 관측성, --json 로그)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# 체크섬 (PRD §FR-7 sha256, 스캐폴드 단계에서는 미사용이나 stack 기준에 포함)
sha2 = "0.10"
# 추상 스토리지 백엔드 (PRD §10 Storage trait). LocalFileSystem은 기본 feature(fs)로 포함되며,
# aws feature는 S3 백엔드 태스크(t7)가 추가한다 — 여기서는 LocalFs만 활성화한다.
object_store = "0.13"
# async fn in trait(dyn) — AFIT는 dyn 미지원이므로 async_trait 매크로를 채택(리서치 architecture §2).
async-trait = "0.1"
# AsyncRead ↔ object_store 스트림 경계 어댑터(ReaderStream / StreamReader).
# ReaderStream이 yield하는 bytes::Bytes는 object_store WriteMultipart::put로 그대로
# 흘러가므로, 이 계층에서 bytes 크레이트를 직접 참조하지 않는다(t4/t7이 필요 시 추가).
tokio-util = { version = "0.7", features = ["io"] }
# Stream 콤비네이터(list 결과 수집, GetResult 스트림 매핑).
futures = "0.3"
# MongoDB 드라이버 — dump 전후 oplog 최신 ts·서버 버전·토폴로지(setName) 조회용(t4 범위).
# default-features=false + rustls-tls로 musl 정적 빌드 호환(리서치 §4/§7). dump 자체는
# mongodump 서브프로세스가 수행하므로 드라이버는 메타데이터 질의에만 쓴다.
mongodb = { version = "3.7", default-features = false, features = ["rustls-tls", "dns-resolver", "bson-2", "compat-3-3-0"] }
# BSON Timestamp{time,increment} — oplog ts를 manifest OplogTimestamp{t,i}로 보존.
bson = "2"
# 백업 ID — UUID v7(시간 정렬 가능, 사전순 = 생성순). manifest.id / 저장 레이아웃 디렉터리.
uuid = { version = "1", features = ["v7"] }
# manifest created_at(UTC RFC3339).
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# 사이드카 체크섬·manifest checksum_sha256의 hex 인코딩.
hex = "0.4"
# 자식 프로세스에 URI를 argv로 넘기지 않기 위한 0600 임시 config 파일(런타임 사용).
tempfile = "3"
# 빌드 호환 핀: time 0.3.44+는 bson 2.15→mongodb 3.7.0의 blanket impl(Checked<T>)과
# 충돌(E0119)한다. 직접 사용하지 않지만 transitive 해석을 0.3.43에 고정해 빌드를 보호한다.
# (mongodb가 time 호환을 갱신하면 제거 가능.)
time = "=0.3.43"

[dev-dependencies]
# Storage trait mock 자동 생성(단위 테스트에서 파이프라인 로직 주입).
mockall = "0.14"
