# 테스트용 MongoDB — single-node replica set 2식 (소스 + 복구 타깃)
#
# x-backup의 증분(oplog)·--oplog 일관성은 replica set 전제(PRD §4)라서
# 단일 노드라도 --replSet 으로 띄우고 healthcheck 안에서 rs.initiate를
# 멱등 수행한다. healthy == PRIMARY 선출 완료이므로 `up -d --wait` 만으로
# 바로 사용 가능하다.
#
# 접속 URI(드라이버 SDAM 토폴로지 탐색 회피 — tests/fixtures/replica-set.sh와 동일 규약):
#   소스:  mongodb://localhost:${XB_MONGO_PORT:-27017}/?replicaSet=rs0&directConnection=true
#   타깃:  mongodb://localhost:${XB_MONGO_TARGET_PORT:-27117}/?replicaSet=rs0&directConnection=true
#
# 주의: tests/fixtures/replica-set.sh(통합 테스트용, 기본 :27017)와 포트가 겹치므로
# 동시에 띄우지 말 것. 데이터는 의도적으로 비영속(컨테이너 제거 시 소멸).
#
# 사용: make mongodb-up / make mongodb-down

services:
  mongodb:
    image: ${XB_MONGO_IMAGE:-mongo:7}
    container_name: x-backup-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${XB_MONGO_PORT:-27017}:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}).ok }'
          | grep -q 1
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s

  # 타깃 분리 복구(UC-3)·PITR 시나리오 검증용 별도 인스턴스.
  mongodb-target:
    image: ${XB_MONGO_IMAGE:-mongo:7}
    container_name: x-backup-mongo-target
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${XB_MONGO_TARGET_PORT:-27117}:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}).ok }'
          | grep -q 1
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
